name: Build Aletheian EPUB Batch 05

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build batch
        run: python3 aletheian-library/run_batch05.py
      - name: Upload batch archive
        uses: actions/upload-artifact@v4
        with:
          name: Aletheian_Library_EPUB_Batch_05
          path: |
            dist/Aletheian_Library_EPUB_Batch_05_20_Books.zip
            dist/Aletheian_Library_EPUB_Batch_05_20_Books.zip.sha256
